name: Gear Shop 4-Stage CI/CD Pipeline

on:
  push:
    branches:
      - main

jobs:
  # ==========================================
  # STAGE 1: LINT & QUALITY CHECK
  # ==========================================
  stage-1-lint:
    name: Stage 1 - Lint & Syntax Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Lint Backend
        working-directory: ./backend
        run: |
          npm install
          npm run lint --if-present

      - name: Lint Frontend
        working-directory: ./frontend
        run: |
          npm install
          npm run lint --if-present

  # ==========================================
  # STAGE 2: BUILD & PUSH DOCKER IMAGES
  # ==========================================
  stage-2-build-push:
    name: Stage 2 - Build & Push to Docker Hub
    needs: stage-1-lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build & Push Backend Image
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          push: true
          tags: ${{ secrets.DOCKER_USERNAME }}/gearshop-backend:latest

      - name: Build & Push Frontend Image
        uses: docker/build-push-action@v5
        with:
          context: ./frontend
          push: true
          build-args: |
            NEXT_PUBLIC_API_URL=http://${{ secrets.PROD_HOST }}:5000
          tags: ${{ secrets.DOCKER_USERNAME }}/gearshop-frontend:latest

  # ==========================================
  # STAGE 3: DEPLOY TO TESTING & HEALTH CHECK
  # ==========================================
  stage-3-deploy-testing:
    name: Stage 3 - Deploy Testing & Verify
    needs: stage-2-build-push
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to Testing EC2 via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.TESTING_HOST }}
          username: ubuntu
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            cd ~/app
            docker compose pull
            docker compose up -d --remove-orphans
            docker image prune -f

      - name: Automated Health Check on Testing
        run: |
          echo "Waiting 15s for containers to boot..."
          sleep 15
          curl --fail --retry 5 --retry-delay 5 http://${{ secrets.TESTING_HOST }}:5000/health

  # ==========================================
  # STAGE 4: AUTO-EVOLUTION TO PRODUCTION (LEVEL 4)
  # ==========================================
  stage-4-deploy-production:
    name: Stage 4 - Auto Deploy Production (Level 4)
    needs: stage-3-deploy-testing
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to Production EC2 via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.PROD_HOST }}
          username: ubuntu
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            cd ~/app
            docker compose pull
            docker compose up -d --remove-orphans
            docker image prune -f

      - name: Verify Production Health
        run: |
          echo "Waiting 15s for Production containers..."
          sleep 15
          curl --fail --retry 5 --retry-delay 5 http://${{ secrets.PROD_HOST }}:5000/health
